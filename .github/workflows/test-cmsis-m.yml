name: Build and test CMSIS-M

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Corstone-300 / Cortex-M55 (${{ matrix.toolchain }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain: [AC6, GCC, CLANG]

    steps:
      - uses: actions/checkout@v7

      - name: Activate vcpkg environment
        uses: ARM-software/cmsis-actions/vcpkg@v1.3.1
        with:
          config: vcpkg-configuration.json
          cache: cmsis-executorch

      # The default Arm license setup is for evaluation only.
      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache CMSIS packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs-m-${{ hashFiles('cmsis-m/*.csolution.yml', 'cmsis-m/board/Corstone-300/*.clayer.yml') }}
          path: /home/runner/.cache/arm/packs

      - name: Cache model-export environment
        uses: actions/cache@v6
        with:
          key: model-export-${{ runner.os }}-${{ hashFiles('model_conversion/requirements*.txt', 'model_conversion/setup_venv.py') }}
          path: .venv

      - name: Install repository ExecuTorch pack
        run: cpackget add --agree-embedded-license Pack/*.pack

      - name: Create model-export environment
        run: ./model_conversion/setup_venv.sh

      - name: Generate Cortex-M MLOps information
        run: cbuild setup cmsis-m/cmsis-m.csolution.yml --active SSE-300-M55 --packs

      - name: Create Cortex-M AI layer
        env:
          PYTHONPATH: ""
        run: .venv/bin/python model_conversion/create_ai_layer.py cmsis-m/cmsis-m.cbuild-mlops.yml

      - name: Build SSE-300-M55
        run: cbuild cmsis-m/cmsis-m.csolution.yml --active SSE-300-M55 --packs --toolchain ${{ matrix.toolchain }}

      - name: Run SSE-300-M55 on FVP simulation
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: |
          set -o pipefail
          FVP_Corstone_SSE-300 \
            -f cmsis-m/board/Corstone-300/fvp_config.txt \
            -a cmsis-m/out/*/SSE-300-M55/*/*.hex \
            --simlimit 120 2>&1 | tee fvp.log

      - name: Check application result
        run: 'grep -Fq "Test_result: PASS" fvp.log'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cmsis-m-SSE-300-M55-${{ matrix.toolchain }}
          path: |
            cmsis-m/out
            cmsis-m/ai_layer
            fvp.log
          if-no-files-found: warn
