project:
  packs:
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: AC6
      CPP:
        - -Wno-nan-infinity-disabled
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ../cmsis-u55/src/app_main.cpp
        - file: ../cmsis-u55/src/arm_embedded_module.cpp
        - file: ../cmsis-u55/src/arm_embedded_module.hpp

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map
